<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- Glowing Sound Sphere / Headphone Pulse Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="105" fill="#00f2fe" fill-opacity="0.08" filter="url(#shadow)"/>

  <!-- Central Dynamic SoundPulse Wave Bars -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Equalizer kinetic bars -->
    <rect x="-80" y="-35" width="14" height="70" rx="7" fill="url(#glow)"/>
    <rect x="-50" y="-60" width="14" height="120" rx="7" fill="url(#glow)"/>
    <rect x="-20" y="-95" width="14" height="190" rx="7" fill="url(#glow)"/>
    <rect x="10" y="-70" width="14" height="140" rx="7" fill="url(#glow)"/>
    <rect x="40" y="-105" width="14" height="210" rx="7" fill="url(#glow)"/>
    <rect x="70" y="-45" width="14" height="90" rx="7" fill="url(#glow)"/>

    <!-- Dynamic Center Play Flare -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Sparkle & Accent Dots -->
  <circle cx="160" cy="140" r="4" fill="#00f2fe" opacity="0.8"/>
  <circle cx="360" cy="150" r="5" fill="#a855f7" opacity="0.8"/>
  <circle cx="370" cy="360" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="140" cy="370" r="3" fill="#00f2fe" opacity="0.7"/>
</svg>
