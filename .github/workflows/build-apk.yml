name: Build Native Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Scaffold Native Kotlin Android Project
        run: |
          rm -rf * .github/workflows/build-apk.yml.bak || true
          mkdir -p app/src/main/java/com/soundpulse/nativeplayer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p gradle/wrapper

          # 1. إعداد Gradle Wrapper
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SoundPulseNative"
          include ':app'
          EOF

          # 2. إعداد build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. إعداد app/build.gradle مع مكتبات Media3 و Compose
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.soundpulse.nativeplayer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.soundpulse.nativeplayer"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              
              // مكتبة Media3 الرسمية من جوجل لدعم الـ MediaSession و Dynamic Bar
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-session:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
          }
          EOF

          # 4. ملف AndroidManifest.xml الأصلي
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_media_play"
                  android:label="SoundPulse Native"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 5. خدمة التشغيل الأصلية في الخلفية (PlaybackService.kt) لدعم الـ Magic Ring
          cat << 'EOF' > app/src/main/java/com/soundpulse/nativeplayer/PlaybackService.kt
          package com.soundpulse.nativeplayer

          import android.content.Intent
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .setUsage(C.USAGE_MEDIA)
                              .build(),
                          true
                      )
                      .build()

                  mediaSession = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = mediaSession

              override fun onDestroy() {
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  super.onDestroy()
              }
          }
          EOF

          # 6. واجهة التطبيق وكود فحص الذاكرة بالنسب المئوية (MainActivity.kt)
          cat << 'EOF' > app/src/main/java/com/soundpulse/nativeplayer/MainActivity.kt
          package com.soundpulse.nativeplayer

          import android.Manifest
          import android.content.ComponentName
          import android.content.ContentUris
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Pause
          import androidx.compose.material.icons.filled.MusicNote
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import com.google.common.util.concurrent.MoreExecutors
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          data class AudioTrack(val id: Long, val title: String, val artist: String, val uri: Uri)

          class MainActivity : ComponentActivity() {
              private var controller: MediaController? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val sessionToken = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  val controllerFuture = MediaController.Builder(this, sessionToken).buildAsync()
                  controllerFuture.addListener({
                      controller = controllerFuture.get()
                  }, MoreExecutors.directExecutor())

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(background = Color(0xFF0F172A), surface = Color(0xFF1E293B))) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              MainScreen(
                                  onPlayTrack = { track ->
                                      controller?.let { player ->
                                          val item = MediaItem.Builder()
                                              .setUri(track.uri)
                                              .setMediaMetadata(
                                                  MediaMetadata.Builder()
                                                      .setTitle(track.title)
                                                      .setArtist(track.artist)
                                                      .build()
                                              )
                                              .build()
                                          player.setMediaItem(item)
                                          player.prepare()
                                          player.play()
                                      }
                                  },
                                  onTogglePlayPause = {
                                      controller?.let { if (it.isPlaying) it.pause() else it.play() }
                                  }
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun MainScreen(onPlayTrack: (AudioTrack) -> Unit, onTogglePlayPause: () -> Unit) {
              var tracks by remember { mutableStateOf<List<AudioTrack>>(emptyList()) }
              var isScanning by remember { mutableStateOf(false) }
              var scanProgress by remember { mutableStateOf(0) }
              var scanTotal by remember { mutableStateOf(0) }
              var currentPlaying by remember { mutableStateOf<AudioTrack?>(null) }
              val context = androidx.compose.ui.platform.LocalContext.current
              val scope = rememberCoroutineScope()

              fun scanMedia() {
                  scope.launch {
                      isScanning = true
                      val list = mutableListOf<AudioTrack>()
                      withContext(Dispatchers.IO) {
                          val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                          val selection = "${MediaStore.Audio.Media.IS_MUSIC} != 0"
                          val cursor = context.contentResolver.query(uri, null, selection, null, null)
                          cursor?.use {
                              val total = it.count
                              scanTotal = total
                              val idCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                              val titleCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                              val artistCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                              var count = 0
                              while (it.moveToNext()) {
                                  count++
                                  val id = it.getLong(idCol)
                                  val title = it.getString(titleCol) ?: "Unknown Title"
                                  val artist = it.getString(artistCol) ?: "Unknown Artist"
                                  val trackUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
                                  list.add(AudioTrack(id, title, artist, trackUri))
                                  scanProgress = ((count.toFloat() / total) * 100).toInt()
                              }
                          }
                      }
                      tracks = list
                      isScanning = false
                  }
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.RequestPermission()
              ) { isGranted ->
                  if (isGranted) scanMedia()
              }

              LaunchedEffect(Unit) {
                  val perm = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
                  if (ContextCompat.checkSelfPermission(context, perm) == PackageManager.PERMISSION_GRANTED) {
                      scanMedia()
                  } else {
                      permissionLauncher.launch(perm)
                  }
              }

              if (isScanning) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          CircularProgressIndicator(color = Color(0xFF38BDF8))
                          Spacer(modifier = Modifier.height(16.dp))
                          Text("جاري فحص ملفات الصوت... $scanProgress%", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Text("تم مسح $scanTotal ملف", color = Color.Gray, fontSize = 13.sp)
                      }
                  }
              } else {
                  Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                      Text("SoundPulse Native Pro", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.White)
                      Text("عدد الأغاني المتاحة: ${tracks.size}", fontSize = 14.sp, color = Color(0xFF94A3B8))
                      Spacer(modifier = Modifier.height(12.dp))

                      LazyColumn(modifier = Modifier.weight(1f)) {
                          items(tracks) { track ->
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 4.dp)
                                      .background(Color(0xFF1E293B), RoundedCornerShape(8.dp))
                                      .clickable {
                                          currentPlaying = track
                                          onPlayTrack(track)
                                      }
                                      .padding(12.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(Icons.Default.MusicNote, contentDescription = null, tint = Color(0xFF38BDF8))
                                  Spacer(modifier = Modifier.width(12.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(track.title, color = Color.White, fontWeight = FontWeight.SemiBold, maxLines = 1)
                                      Text(track.artist, color = Color.Gray, fontSize = 12.sp, maxLines = 1)
                                  }
                              }
                          }
                      }

                      currentPlaying?.let { track ->
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF0284C7))
                          ) {
                              Row(
                                  modifier = Modifier.padding(14.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(track.title, color = Color.White, fontWeight = FontWeight.Bold, maxLines = 1)
                                      Text(track.artist, color = Color.White.copy(alpha = 0.8f), fontSize = 12.sp)
                                  }
                                  IconButton(onClick = onTogglePlayPause) {
                                      Icon(Icons.Default.PlayArrow, contentDescription = null, tint = Color.White)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Native APK with Gradle
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Native APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundPulse-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk