name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Inject MediaSession & System Volume Integration
        run: |
          cat << 'EOF' > inject-media.js
          const fs = require('fs');
          const path = './index.html';
          if (fs.existsSync(path)) {
            let html = fs.readFileSync(path, 'utf8');
            const mediaScript = `
            <script>
              // تزامن الـ MediaSession مع الـ Dynamic Island / Magic Ring
              document.addEventListener('play', function(e) {
                if (e.target.tagName === 'AUDIO') {
                  const audio = e.target;
                  audio.volume = 1.0; // توحيد الصوت مع صوت النظام
                  if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                      title: document.title || 'SoundPulse Track',
                      artist: 'SoundPulse Pro',
                      album: 'SoundPulse Player'
                    });
                    navigator.mediaSession.playbackState = 'playing';
                    navigator.mediaSession.setActionHandler('play', () => audio.play());
                    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                    navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 10; });
                    navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 10; });
                  }
                }
              }, true);

              document.addEventListener('pause', function(e) {
                if (e.target.tagName === 'AUDIO' && 'mediaSession' in navigator) {
                  navigator.mediaSession.playbackState = 'paused';
                }
              }, true);
            </script>
            `;
            html = html.replace('</head>', mediaScript + '</head>');
            fs.writeFileSync(path, html);
          }
          EOF
          node inject-media.js

      - name: Build Web Assets
        run: npm run build

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem --legacy-peer-deps
          npx cap init "SoundPulse Pro" "com.soundpulse.app" --web-dir dist
          npx cap add android
          npx cap copy

      - name: Inject Android Permissions & Foreground Service
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPulse-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk