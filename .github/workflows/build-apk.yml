name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web Assets
        run: npm run build

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "SoundPulse Pro" "com.soundpulse.app" --web-dir dist
          npx cap add android
          npx cap copy

      - name: Inject Android Permissions & Query Providers
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

      - name: Inject Native Auto-Scanner Plugin (Java)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/soundpulse/app/MediaScannerPlugin.java
          package com.soundpulse.app;

          import android.Manifest;
          import android.content.ContentUris;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "MediaScanner",
              permissions = {
                  @Permission(
                      strings = { Manifest.permission.READ_MEDIA_AUDIO },
                      alias = "audio"
                  ),
                  @Permission(
                      strings = { Manifest.permission.READ_EXTERNAL_STORAGE },
                      alias = "storage"
                  )
              }
          )
          public class MediaScannerPlugin extends Plugin {

              @PluginMethod
              public void scanAudioFiles(PluginCall call) {
                  String permAlias = (Build.VERSION.SDK_INT >= 33) ? "audio" : "storage";
                  if (getPermissionState(permAlias) != com.getcapacitor.PermissionState.GRANTED) {
                      requestPermissionForAlias(permAlias, call, "permissionCallback");
                  } else {
                      loadAudio(call);
                  }
              }

              @PermissionCallback
              private void permissionCallback(PluginCall call) {
                  loadAudio(call);
              }

              private void loadAudio(PluginCall call) {
                  JSArray tracks = new JSArray();
                  Uri uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                  String selection = MediaStore.Audio.Media.IS_MUSIC + " != 0";
                  String sortOrder = MediaStore.Audio.Media.TITLE + " ASC";

                  String[] projection = {
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.ARTIST,
                      MediaStore.Audio.Media.DURATION
                  };

                  try (Cursor cursor = getContext().getContentResolver().query(uri, projection, selection, null, sortOrder)) {
                      if (cursor != null) {
                          int idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID);
                          int titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE);
                          int artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST);
                          int durCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION);

                          while (cursor.moveToNext()) {
                              long id = cursor.getLong(idCol);
                              String title = cursor.getString(titleCol);
                              String artist = cursor.getString(artistCol);
                              long duration = cursor.getLong(durCol);

                              Uri contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id);

                              JSObject track = new JSObject();
                              track.put("id", String.valueOf(id));
                              track.put("title", title);
                              track.put("artist", (artist != null && !artist.equals("<unknown>")) ? artist : "Unknown Artist");
                              track.put("url", contentUri.toString());
                              track.put("duration", duration / 1000);
                              tracks.put(track);
                          }
                      }
                  } catch (Exception e) {
                      call.reject("Failed to read audio: " + e.getMessage());
                      return;
                  }

                  JSObject ret = new JSObject();
                  ret.put("tracks", tracks);
                  call.resolve(ret);
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/soundpulse/app/MainActivity.java
          package com.soundpulse.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaScannerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Inject Client-Side Auto-Load & Audio Engine
        run: |
          cat << 'EOF' > patch_script.py
          import os

          target = 'android/app/src/main/assets/public/index.html'
          if not os.path.exists(target):
              for root, dirs, files in os.walk('.'):
                  if 'index.html' in files and 'node_modules' not in root:
                      target = os.path.join(root, 'index.html')
                      break

          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8') as f:
                  html = f.read()

              auto_script = """
          <script>
            window.addEventListener('DOMContentLoaded', function() {
              function triggerAutoScan() {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.MediaScanner) {
                  window.Capacitor.Plugins.MediaScanner.scanAudioFiles().then(function(res) {
                    if (res && res.tracks && res.tracks.length > 0) {
                      window.dispatchEvent(new CustomEvent('soundpulse:tracks-loaded', { detail: res.tracks }));
                      window.__LOCAL_TRACKS__ = res.tracks;
                    }
                  }).catch(function(err) {
                    console.log('Scan error:', err);
                  });
                } else {
                  setTimeout(triggerAutoScan, 500);
                }
              }
              triggerAutoScan();

              let audioCtx = null;
              function initLimiter(audio) {
                try {
                  const AudioCtx = window.AudioContext || window.webkitAudioContext;
                  if (!AudioCtx) return;
                  if (!audioCtx) audioCtx = new AudioCtx();
                  if (audioCtx.state === 'suspended') audioCtx.resume();

                  const src = audioCtx.createMediaElementSource(audio);
                  const hp = audioCtx.createBiquadFilter();
                  hp.type = 'highpass';
                  hp.frequency.setValueAtTime(25, audioCtx.currentTime);

                  const comp = audioCtx.createDynamicsCompressor();
                  comp.threshold.setValueAtTime(-1.0, audioCtx.currentTime);
                  comp.knee.setValueAtTime(0.0, audioCtx.currentTime);
                  comp.ratio.setValueAtTime(20.0, audioCtx.currentTime);
                  comp.attack.setValueAtTime(0.001, audioCtx.currentTime);
                  comp.release.setValueAtTime(0.1, audioCtx.currentTime);

                  src.connect(hp);
                  hp.connect(comp);
                  comp.connect(audioCtx.destination);
                } catch(e){}
              }

              document.addEventListener('play', function(e) {
                if (e.target && e.target.tagName === 'AUDIO') {
                  const audio = e.target;
                  audio.volume = 1.0;
                  initLimiter(audio);

                  if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                      title: document.title || 'SoundPulse Track',
                      artist: 'SoundPulse Pro',
                      album: 'Offline Local Library'
                    });
                    navigator.mediaSession.playbackState = 'playing';
                    navigator.mediaSession.setActionHandler('play', function() { audio.play(); });
                    navigator.mediaSession.setActionHandler('pause', function() { audio.pause(); });
                    navigator.mediaSession.setActionHandler('seekbackward', function() { audio.currentTime -= 10; });
                    navigator.mediaSession.setActionHandler('seekforward', function() { audio.currentTime += 10; });
                  }
                }
              }, true);

              document.addEventListener('pause', function(e) {
                if (e.target && e.target.tagName === 'AUDIO' && 'mediaSession' in navigator) {
                  navigator.mediaSession.playbackState = 'paused';
                }
              }, true);
            });
          </script>
          """
              if '</head>' in html:
                  html = html.replace('</head>', auto_script + '\n</head>')
                  with open(target, 'w', encoding='utf-8') as f:
                      f.write(html)
                  print('Injected successfully!')
          EOF
          python3 patch_script.py

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPulse-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk