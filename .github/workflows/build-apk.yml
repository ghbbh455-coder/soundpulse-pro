name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Patch HTML for Offline Audio & Dynamic Island
        run: |
          python3 -c "
          import os

          target_file = 'index.html'
          if not os.path.exists(target_file):
              # البحث عن ملف index.html في حال كان داخل مجلد فرعي
              for root, dirs, files in os.walk('.'):
                  if 'index.html' in files and 'node_modules' not in root:
                      target_file = os.path.join(root, 'index.html')
                      break

          if os.path.exists(target_file):
              with open(target_file, 'r', encoding='utf-8') as f:
                  content = f.read()

              patch = '''
          <script>
            (function() {
              // 1. مانع الخرفشة والتقطيع (Anti-Clipping & Distortion Limiter)
              let audioCtx = null;
              function initLimiter(audio) {
                try {
                  const AudioContext = window.AudioContext || window.webkitAudioContext;
                  if (!AudioContext) return;
                  if (!audioCtx) audioCtx = new AudioContext();
                  if (audioCtx.state === 'suspended') audioCtx.resume();
                  
                  const src = audioCtx.createMediaElementSource(audio);
                  const compressor = audioCtx.createDynamicsCompressor();
                  compressor.threshold.setValueAtTime(-1.5, audioCtx.currentTime);
                  compressor.knee.setValueAtTime(6.0, audioCtx.currentTime);
                  compressor.ratio.setValueAtTime(12.0, audioCtx.currentTime);
                  compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
                  compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

                  const gain = audioCtx.createGain();
                  gain.gain.setValueAtTime(0.92, audioCtx.currentTime);

                  src.connect(compressor);
                  compressor.connect(gain);
                  gain.connect(audioCtx.destination);
                } catch(e){}
              }

              // 2. تفعيل الـ MediaSession للـ Dynamic Bar (Infinix Magic Ring) بدون نت
              document.addEventListener('play', function(e) {
                if (e.target && e.target.tagName === 'AUDIO') {
                  const audio = e.target;
                  audio.volume = 1.0;
                  initLimiter(audio);

                  if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                      title: document.title || 'Local Track',
                      artist: 'SoundPulse Pro (Offline)',
                      album: 'Offline Music'
                    });
                    navigator.mediaSession.playbackState = 'playing';
                    navigator.mediaSession.setActionHandler('play', () => audio.play());
                    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                    navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 10; });
                    navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 10; });
                  }
                }
              }, true);

              document.addEventListener('pause', function(e) {
                if (e.target && e.target.tagName === 'AUDIO' && 'mediaSession' in navigator) {
                  navigator.mediaSession.playbackState = 'paused';
                }
              }, true);
            })();
          </script>
          '''
              if '</head>' in content:
                  content = content.replace('</head>', patch + '\n</head>')
                  with open(target_file, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('HTML successfully patched for offline audio and dynamic bar!')
          "

      - name: Build Web Assets
        run: npm run build

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem --legacy-peer-deps
          npx cap init "SoundPulse Pro" "com.soundpulse.app" --web-dir dist
          npx cap add android
          npx cap copy

      - name: Inject Android Permissions & Background Mode
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPulse-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
